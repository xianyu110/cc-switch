name: Cross-platform unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned Windows bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pnpm tauri build
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Tauri returned $LASTEXITCODE because updater signing is not configured; continuing with unsigned bundles."
            $global:LASTEXITCODE = 0
          }
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -Recurse | Select-Object -First 1
          $exe = Get-Item src-tauri/target/release/cc-switch.exe
          if ($null -eq $msi -or $null -eq $exe) { throw 'Windows bundles were not generated' }
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          Copy-Item $exe.FullName artifacts/portable/cc-switch.exe
          Set-Content artifacts/portable/portable.ini "portable=true`narch=x86_64" -Encoding UTF8
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/CC-Switch-v3.16.5-Windows-Portable.zip -Force
          Copy-Item $msi.FullName artifacts/CC-Switch-v3.16.5-Windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: cc-switch-v3.16.5-windows-x86_64
          path: artifacts/*

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl wget file patchelf rpm libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned Linux bundles
        shell: bash
        run: |
          set +e
          pnpm tauri build --bundles appimage,deb,rpm
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Tauri returned $code because updater signing is not configured; continuing with unsigned bundles."
          fi
          mkdir -p artifacts
          appimage=$(find src-tauri/target/release/bundle -type f -name '*.AppImage' | head -1)
          deb=$(find src-tauri/target/release/bundle -type f -name '*.deb' | head -1)
          rpm=$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -1)
          [ -n "$appimage" ] && cp "$appimage" artifacts/CC-Switch-v3.16.5-Linux-x86_64.AppImage
          [ -n "$deb" ] && cp "$deb" artifacts/CC-Switch-v3.16.5-Linux-x86_64.deb
          [ -n "$rpm" ] && cp "$rpm" artifacts/CC-Switch-v3.16.5-Linux-x86_64.rpm
          test -n "$(find artifacts -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cc-switch-v3.16.5-linux-x86_64
          path: artifacts/*

  publish:
    name: Upload Windows and Linux assets to v3.16.5
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cc-switch-v3.16.5-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets to existing prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.16.5
          prerelease: true
          files: release-assets/*
